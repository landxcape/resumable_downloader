name: resumable_downloader
description: Reliable Flutter downloads with multipart ranges, durable resume, scheduling, integrity checks, and authenticated restoration.
version: 0.1.1
homepage: https://github.com/landxcape/resumable_downloader
repository: https://github.com/landxcape/resumable_downloader
topics:
  - downloader
  - resumable-download
  - dio
  - flutter
  - concurrency

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  dio: ^5.10.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
